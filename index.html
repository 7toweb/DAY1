<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>7ToWeb Challenge - Day One</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #1E90FF, #8A2BE2);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
    }

    h2 {
      font-size: 1.5rem;
      margin-bottom: 15px;
    }

    h3 {
      font-size: 1.2rem;
      margin-bottom: 20px;
      color: #FFD700;
    }

    p {
      font-size: 1.2rem;
      margin-bottom: 30px;
    }

    button {
      background: #FF6F00;
      border: none;
      padding: 15px 30px;
      font-size: 1.2rem;
      border-radius: 10px;
      color: #fff;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #FFA500;
    }

    footer {
      position: absolute;
      bottom: 10px;
      font-size: 0.9rem;
      color: rgba(255,255,255,0.8);
    }

  </style>
</head>
<body>

  <div class="hero">
    <h1>💻 7ToWeb Challenge</h1>
    <h2>Day One Challenge!</h2>
    <h3>Follow & Share karo, aur apni website banwao 🚀</h3>
    <p>Ek follower = Ek website 🎉<br>
       Start your journey and get your own site now!</p>
    <button onclick="alert('Apni website banwane ke liye DM karo ya form fill karo!')">Start Now</button>
  </div>

  <footer>
    Made with ❤️ by 7ToWeb
  </footer>

</body>
</html>
